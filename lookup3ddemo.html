<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Model Viewer Examples</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.0/model-viewer.min.js"></script>
</head>
<body>
  <h1>Google Model Viewer Examples</h1>
  <p>See: <a href="https://github.com/google/model-viewer">google/model-viewer</a></p>

  <!-- add simple flex grid with wrapping-->
  <div style="display:flex;flex-wrap:wrap;gap:20px">

    <div style="margin-bottom:20px">
      <h2>Irregular Structure GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/irregular_structure-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>

    <div style="margin-bottom:20px">
      <h2>House GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/House-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>

    <div style="margin-bottom:20px">
      <h2>Dodo GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/Dodo-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>

    <div style="margin-bottom:20px">
      <h2>Chair GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/Chair-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>

     <div style="margin-bottom:20px">
      <h2>Pawn GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/pawn-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>

    <div style="margin-bottom:20px">
      <h2>Bunny GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="files/bunny-webpreview.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
 
  </div>
</body>
</html>
