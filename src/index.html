<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Model Viewer Examples</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.0/model-viewer.min.js"></script>
</head>
<body>
  <h1>Google Model Viewer Examples</h1>
  <p>See: <a href="https://github.com/google/model-viewer">google/model-viewer</a></p>

  <!-- add simple flex grid with wrapping-->
  <div style="display:flex;flex-wrap:wrap;gap:20px">
    <div style="margin-bottom:20px">
      <h2>chess pawn GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="https://fixtures.iiif.io/3d/thomas_flynn/chess/Pawn_black.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
    <div style="margin-bottom:20px">
      <h2>swan boat GLB (must be on NYU VPN)</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="https://devultraviolet.library.nyu.edu/records/rgxqj-tej54/files/00b0_Swan_Boat.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
    <div style="margin-bottom:20px">
      <h2>whale cranium GLB</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="https://raw.githubusercontent.com/IIIF/3d/main/assets/whale/whale_cranium.glb" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
    <div style="margin-bottom:20px">
      <h2>mosquito in amber GLTF</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/MosquitoInAmber/glTF/MosquitoInAmber.gltf" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
    <div style="margin-bottom:20px">
      <h2>sponza GLTF</h2>
      <model-viewer style="width:500px;height:300px;background:#F6F0FC;" src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/refs/heads/main/2.0/Sponza/glTF/Sponza.gltf" alt="A 3D model" auto-rotate camera-controls></model-viewer>
    </div>
  </div>
</body>
</html>
